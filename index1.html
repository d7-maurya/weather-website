<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast - 7 Day Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div class="app">
      <!-- Header Section -->
      <header class="header">
        <div class="container">
          <h1 class="header__title">Weather Forecast</h1>
          <div class="search-container">
            <div class="search-box">
              <input
                type="text"
                id="cityInput"
                class="form-control search-input"
                placeholder="Search for a city..."
                autocomplete="off"
              />
              <button id="searchBtn" class="btn btn--primary search-btn">
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.35-4.35" />
                </svg>
              </button>
            </div>
            <button
              id="locationBtn"
              class="btn btn--outline location-btn"
              title="Use current location"
            >
              <svg
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                <circle cx="12" cy="10" r="3" />
              </svg>
              <span>Current Location</span>
            </button>
          </div>
        </div>
      </header>

      <!-- Loading Spinner -->
      <div id="loadingSpinner" class="loading hidden">
        <div class="container">
          <div class="loading-content">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
          </div>
        </div>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="error-message hidden">
        <div class="container">
          <div class="error-card">
            <h3>Oops! Something went wrong</h3>
            <p id="errorText"></p>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <main class="main container fade-in">
        <!-- Current Weather -->
        <section id="currentWeather" class="current-weather hidden">
          <div class="current-weather__card">
            <div class="current-weather__header">
              <div class="location-info">
                <h2 id="locationName"></h2>
                <p id="currentDate"></p>
              </div>
              <div class="weather-icon animate-pop">
                <img
                  id="currentIcon"
                  src=""
                  alt="Weather icon"
                  width="90"
                  height="90"
                />
              </div>
            </div>

            <div class="current-weather__main">
              <div class="temperature-display">
                <span id="currentTemp"></span>
                <span class="temp-unit">°C</span>
              </div>
              <div class="weather-description">
                <p id="weatherDescription"></p>
                <p class="feels-like">
                  Feels like <span id="feelsLike"></span>°C
                </p>
              </div>
            </div>

            <div class="current-weather__details">
              <div class="detail-item">
                <div class="detail-icon">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
                  </svg>
                </div>
                <div class="detail-info">
                  <span class="detail-label">Humidity</span>
                  <span id="humidity"></span>
                </div>
              </div>
              <div class="detail-item">
                <div class="detail-icon">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path
                      d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"
                    />
                  </svg>
                </div>
                <div class="detail-info">
                  <span class="detail-label">Wind Speed</span>
                  <span id="windSpeed"></span>
                </div>
              </div>
              <div class="detail-item">
                <div class="detail-icon">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <path d="M12 2v20m0-20l4 4m-4-4L8 6" />
                  </svg>
                </div>
                <div class="detail-info">
                  <span class="detail-label">Pressure</span>
                  <span id="pressure"></span>
                </div>
              </div>
              <div class="detail-item">
                <div class="detail-icon">
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                  >
                    <circle cx="12" cy="12" r="5" />
                    <path
                      d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                    />
                  </svg>
                </div>
                <div class="detail-info">
                  <span class="detail-label">UV Index</span>
                  <span id="uvIndex"></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 7-Day Forecast -->
        <section id="forecast" class="forecast hidden">
          <h2 class="forecast__title">7-Day Outlook</h2>
          <div class="forecast__container" id="forecastContainer">
            <!-- Forecast cards will be inserted here -->
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
